# ============================================================
#  ShoulderGuard 設定ファイル
# ============================================================

settings:
  # カメラインデックス（通常は 0 = 内蔵カメラ）
  camera_index: 0

  # 何秒ごとにチェックするか（小さいほど検出が速いがCPU負荷が上がる）
  check_interval_sec: 1.0

  # 2人以上検出し続けないとトリガーしない時間（秒）
  # → 一瞬映り込んだだけでは反応しない。連続検出のみ実行
  trigger_delay_sec: 2.0

  # 一度トリガーしてから次にトリガーするまでの最短間隔（秒）
  cooldown_sec: 15

  # 顔として認識する最小サイズ（ピクセル）
  # 小さくすると遠くの顔も拾うが誤検知が増える
  min_face_size: [60, 60]

  # 顔検出の精度調整（1.05〜1.3 推奨 / 小さい→精度↑・遅い）
  scale_factor: 1.1

  # 顔と判断するのに必要な近傍矩形数（3〜8 推奨 / 大きい→誤検知↓）
  min_neighbors: 5

  # スクリーンショットの保存先
  screenshot_dir: "~/ShoulderGuard/captures"

  # 別タブで開くURL（open_url: true のとき使用）
  redirect_url: "https://www.google.com"

# ============================================================
#  アクション設定（true / false で切り替え）
# ============================================================
actions:
  # 第三者検出時にmacOS通知を送る
  notify: true

  # 検出時のカメラ映像を画像として保存する
  screenshot: true

  # 警告音を鳴らす
  play_sound: false

  # 指定URLをブラウザで開く（安全なページへ誘導）
  open_url: false

  # 画面をロックする（最後に実行される）
  lock_screen: true
